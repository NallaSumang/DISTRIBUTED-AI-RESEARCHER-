<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradRed" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#fca5a5" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="25" fill="#000000" />
  
  <!-- Swarm Shards (Dragon Scales) -->
  <polygon points="70,20 85,35 65,55 50,40" fill="url(#gradRed)" filter="url(#glow)"/>
  <polygon points="55,15 70,30 40,60 25,45" fill="url(#gradRed)" filter="url(#glow)"/>
  <polygon points="40,10 55,25 20,60 5,45" fill="url(#gradRed)" filter="url(#glow)" opacity="0.5"/>
  
  <polygon points="30,80 15,65 35,45 50,60" fill="url(#gradRed)" filter="url(#glow)"/>
  <polygon points="45,85 30,70 60,40 75,55" fill="url(#gradRed)" filter="url(#glow)"/>
  <polygon points="60,90 45,75 80,40 95,55" fill="url(#gradRed)" filter="url(#glow)" opacity="0.5"/>
  
  <!-- Central Diamond (The Hive Core) -->
  <polygon points="50,35 65,50 50,65 35,50" fill="#ffffff" filter="url(#glow)"/>
</svg>
